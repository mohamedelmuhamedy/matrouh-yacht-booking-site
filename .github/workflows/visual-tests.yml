name: Visual regression tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  playwright:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: drtravel2024
      # JWT_SECRET is required by the API server for /api/admin/login. In CI
      # we use a throwaway value scoped to the test database; for shared/prod
      # databases use a real `${{ secrets.JWT_SECRET }}` instead.
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-throwaway-jwt-secret-for-visual-tests' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-throwaway-session-secret' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @workspace/dr-travel exec playwright install --with-deps chromium

      - name: Push DB schema
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter db push-force || pnpm --filter db push

      - name: Seed admin user
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter @workspace/scripts run setup-admin

      - name: Run Playwright suite
        run: pnpm --filter @workspace/dr-travel run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/dr-travel/playwright-report/
            artifacts/dr-travel/tests/.output/
          retention-days: 14
